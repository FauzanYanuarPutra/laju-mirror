name: Build Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    name: Build Windows installers
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare official scrcpy and ADB binaries
        shell: pwsh
        run: ./scripts/prepare-windows-tools.ps1

      - name: Install frontend dependencies
        run: npm install

      - name: Generate application icons
        run: npm run tauri icon src-tauri/icons/icon.svg

      - name: Build MSI and NSIS installers
        run: npm run tauri build -- --bundles msi,nsis

      - name: Sign Windows installers when a trusted certificate is configured
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: ./scripts/sign-windows.ps1

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          name: LajuMirror ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe