name: Build Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    name: Build Windows installers
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Require trusted code-signing certificate
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_PASSWORD)) {
            throw "A trusted Windows code-signing certificate is required for public releases. Configure WINDOWS_SIGNING_PFX_BASE64 and WINDOWS_SIGNING_PFX_PASSWORD in repository Actions secrets."
          }
          $bytes = [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64)
          $flags = [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
          $certificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
            $bytes, $env:WINDOWS_SIGNING_PFX_PASSWORD, $flags
          )
          if (-not $certificate.HasPrivateKey) {
            throw "The configured PFX does not contain its private key."
          }
          if ($certificate.NotAfter -le (Get-Date)) {
            throw "The configured code-signing certificate has expired."
          }
          $codeSigningOid = "1.3.6.1.5.5.7.3.3"
          $eku = $certificate.Extensions |
            Where-Object { $_.Oid.Value -eq "2.5.29.37" } |
            ForEach-Object { $_.EnhancedKeyUsages } |
            ForEach-Object { $_.Value }
          if ($eku -notcontains $codeSigningOid) {
            throw "The configured certificate does not include the Code Signing EKU."
          }
          $chain = [System.Security.Cryptography.X509Certificates.X509Chain]::new()
          if (-not $chain.Build($certificate)) {
            $status = ($chain.ChainStatus | ForEach-Object { $_.StatusInformation.Trim() }) -join "; "
            throw "The configured certificate chain is not trusted by the Windows build runner: $status"
          }
          Write-Host "A code-signing certificate with a private key and trusted chain is configured."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare official scrcpy and ADB binaries
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/prepare-windows-tools.ps1

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Sign unsigned bundled scrcpy and ADB binaries when trusted signing is configured
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          WINDOWS_SIGNING_REQUIRED: "true"
        run: ./scripts/sign-windows-runtime-tools.ps1

      - name: Generate application icons
        run: npm run tauri icon src-tauri/icons/icon.svg

      - name: Build Windows installers and sign the app binary when configured
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          WINDOWS_SIGNING_REQUIRED: "true"
        run: npm run tauri build -- --bundles msi,nsis

      - name: Sign Windows installers when a trusted certificate is configured
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          WINDOWS_SIGNING_REQUIRED: "true"
        run: ./scripts/sign-windows.ps1

      - name: Create signature and SHA-256 manifest
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: ./scripts/write-windows-manifest.ps1

      - name: Verify every distributable binary is Authenticode-valid
        shell: pwsh
        env:
          WINDOWS_SIGNING_REQUIRED: "true"
        run: ./scripts/verify-windows-signatures.ps1

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          name: LajuMirror ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            artifacts/windows-release/*
