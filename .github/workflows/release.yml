name: Build Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    name: Build Windows installers
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare official scrcpy and ADB binaries
        shell: pwsh
        run: ./scripts/prepare-windows-tools.ps1

      - name: Install frontend dependencies
        run: npm install

      - name: Generate application icons
        run: npm run tauri icon src-tauri/icons/icon.svg

      - name: Build MSI and NSIS installers
        run: npm run tauri build -- --bundles msi,nsis

      - name: Sign Windows installers when a trusted certificate is configured
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_PASSWORD)) {
            Write-Host "No code-signing certificate configured. Installers will remain unsigned."
            exit 0
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP "lajumirror-signing.pfx"
          try {
            $pfxBytes = [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64)
            [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)

            $programFilesX86 = [Environment]::GetFolderPath("ProgramFilesX86")
            $sdkBin = Join-Path $programFilesX86 "Windows Kits/10/bin"
            $signtool = Get-ChildItem -Path $sdkBin -Filter signtool.exe -Recurse -File -ErrorAction Stop |
              Where-Object { $_.FullName -match "\\x64\\signtool\.exe$" } |
              Sort-Object FullName -Descending |
              Select-Object -First 1

            if (-not $signtool) {
              throw "Windows SDK SignTool was not found on the runner."
            }

            $installers = @(
              Get-ChildItem "src-tauri/target/release/bundle/msi" -Filter "*.msi" -File
              Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File
            )

            if ($installers.Count -eq 0) {
              throw "No Windows installer files were found to sign."
            }

            foreach ($installer in $installers) {
              Write-Host "Signing $($installer.Name)"
              & $signtool.FullName sign /fd SHA256 /td SHA256 /tr "http://timestamp.digicert.com" /f $pfxPath /p $env:WINDOWS_SIGNING_PFX_PASSWORD $installer.FullName
              if ($LASTEXITCODE -ne 0) {
                throw "SignTool failed for $($installer.Name)."
              }

              & $signtool.FullName verify /pa /v $installer.FullName
              if ($LASTEXITCODE -ne 0) {
                throw "Signature verification failed for $($installer.Name)."
              }
            }
          }
          finally {
            if (Test-Path $pfxPath) {
              Remove-Item $pfxPath -Force
            }
          }

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          name: LajuMirror ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe