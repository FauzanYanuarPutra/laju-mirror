name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-check:
    name: Windows application checks
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install frontend dependencies
        run: npm install

      - name: TypeScript check
        run: npm run check

      - name: Build frontend
        run: npm run build

      - name: Prepare official scrcpy and ADB binaries
        shell: pwsh
        run: ./scripts/prepare-windows-tools.ps1

      - name: Generate application icons
        run: npm run tauri icon src-tauri/icons/icon.svg

      - name: Build Windows installers
        run: npm run tauri build -- --bundles msi,nsis

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Check Rust backend
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Upload Windows installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lajumirror-windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14